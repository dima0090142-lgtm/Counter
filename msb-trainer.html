  update(dt) {
    const g = Sync.selected, bus = Model.bus, V = CONFIG.gen.Un;
    if (g) {
      bus.live ? this.mV.set(bus.U * V, 0) : this.mV.off(0);
      g.U > 0.03 ? this.mV.set(g.U * V, 1) : this.mV.off(1);
      bus.live ? this.mF.set(bus.f, 0) : this.mF.off(0);
      g.U > 0.25 ? this.mF.set(g.f, 1) : this.mF.off(1);
    } else { this.mV.off(0); this.mV.off(1); this.mF.off(0); this.mF.off(1); }
    // синхроноскоп и лампы
    let b = [0, 0, 0];
    if (g && bus.live && g.U > 0.25) {
      const phi = g.delta - bus.ang, ui = g.U, ub = bus.U;
      this.scope.set(U.deg(U.wrapPi(phi)));
      const lv = (ai, ab) => Cx.abs(Cx.sub(Cx.pol(ui, phi + ai), Cx.pol(ub, ab))) / 2;
      const k = 2 * Math.PI / 3;
      const v = Sync.lamps === 'DARK' ? [lv(0, 0), lv(-k, -k), lv(k, k)] : [lv(0, 0), lv(-k, k), lv(k, -k)];
      b = v.map(x => Math.pow(U.clamp(x, 0, 1), 2.2));
    } else this.scope.off();
    // L1 — R-R', L2 (слева) — S-T', L3 (справа) — T-S': при вращении по часовой тёмная точка идёт L1 → L3 → L2
    this.sl[0].style.setProperty('--b', b[0].toFixed(3));
    this.sl[1].style.setProperty('--b', b[2].toFixed(3));
    this.sl[2].style.setProperty('--b', b[1].toFixed(3));
    this.scope.update(dt); this.mV.update(dt); this.mF.update(dt);
  }
  updateSlow() {
    const g = Sync.selected, r = g ? Sync.check(g) : null;
    UIK.setLamp(this.ledBus, Model.bus.live); UIK.setLamp(this.ledInc, r && r.live);
    UIK.setLamp(this.ledU, r && r.live && r.okU); UIK.setLamp(this.ledF, r && r.live && r.okF); UIK.setLamp(this.ledP, r && r.live && r.okP);
    UIK.setLamp(this.ledByp, Sync.bypass, true);
    UIK.setLamp(this.lPermit, r && r.permit);
    UIK.setLamp(this.lAuto, g && g.autoSync.active, g && g.autoSync.phase === 'LOAD');
    UIK.setLamp(this.lClosed, g && g.acb.closed); UIK.setLamp(this.lOpen, g && !g.acb.closed);
    this.kSel.set(g ? g.i + 1 : 0);
    const m = Math.floor(Sync.scopeOnT / 60), sec = Math.floor(Sync.scopeOnT % 60);
    this.lcd.innerHTML = g ? `INC ${g.tag}\nON ${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}\n${Sync.scopeOnT > CONFIG.sync.scopeMaxTime ? '<span class="a">>15 MIN</span>' : '<span class="d">SCOPE</span>'}\n${Sync.mode}` : 'SYNC\nOFF\n\n' + Sync.mode;
    if (g) {
      const as = g.autoSync;
      this.lcd2.innerHTML = `${g.name}\nU ${g.volts.toFixed(0).padStart(4)} V\nf ${g.f.toFixed(2)}\nP ${g.kW.toFixed(0).padStart(5)}\n${as.active ? '<span class="w">' + (as.phase === 'LOAD' ? 'LOADING' : 'AUTO SYNC') + '</span>' : (g.acb.closed ? 'ON BUS' : '<span class="d">MANUAL</span>')}\n<span class="d">${g.eng.state}</span>`;
    } else this.lcd2.innerHTML = '—\n\nSELECT\nGEN.';
  }
}

class AlarmPanel {

    const p = this.el = U.el('div', 'panel span2 alarms snapA', board); p.dataset.panel = 'ALARM';

    this.w = {};
    const groups = [...Model.gens.map(g => [g.tag, `${g.name} GENERATOR`, 3]), ['COM', 'COMMON', 5]];
    let x = 30;
    for (const [gr, title, cols] of groups) {
      const ids = Alarms.order.filter(id => Alarms.wins[id].group === gr);
      const bw = cols * 80 + (cols - 1) * 4;
      UIK.plate(p, title, x, 32, bw);
      ids.forEach((id, k) => {
        const d = U.el('div', 'win ' + Alarms.wins[id].sev, p, Alarms.wins[id].text.replace(/^No\.\d GEN |^No\.\d /, ''));
        U.place(d, x + (k % cols) * 84, 48 + Math.floor(k / cols) * 42);

      return b;
    };
    btn('yellow', 30, 'ACK', () => Alarms.ack());
    btn('black', 96, 'SILENCE', () => Alarms.silence());
    btn('blue', 162, 'RESET', () => Alarms.reset());
    btn('white', 228, 'LAMP TEST', () => {}, () => { Alarms.lampTest = true; document.body.classList.add('lamptest'); }, () => { Alarms.lampTest = false; document.body.classList.remove('lamptest'); });
    this.lHorn = UIK.lamp(p, 'red', 304, by + 1, '', 'sm');

    this.sum = U.el('div', 'subplate', p, ''); this.sum.style.left = '370px'; this.sum.style.top = (by + 4) + 'px'; this.sum.style.fontWeight = '700';
    UIK.plate(p, 'EVENT LOG', 30, 228, 1192);
    this.log = U.el('div', 'alog', p); U.place(this.log, 30, 242, 1192, 106);
  }
  update() {}
  updateSlow() {
    for (const id in this.w) {
      const w = Alarms.wins[id], d = this.w[id];
      let lit = false, dim = false;
      if (Alarms.lampTest) lit = true;
      else if (w.state === 'ALM') lit = UI.blinkFast;

      d.classList.toggle('lit', lit); d.classList.toggle('dimw', dim && !Alarms.lampTest);
    }

    const c = Alarms.counts();
    this.sum.textContent = `UNACK ${c.unack}   ACTIVE ${c.active}`;
    if (Log.dirty) {
      Log.dirty = false;
      this.log.innerHTML = Log.items.slice(0, 120).map(e => `<div class="${e.type}"><span class="c">${e.clock}</span> ${e.text.replace(/</g, '&lt;')}</div>`).join('');
    }

Model.genReset = function (g) {
  let done = [];
  if (g.acb.tripped) { if (g.faults.diff) { UI.toast(`${g.name}: дифзащита — неисправность не устранена`, 'err'); } else { done.push('ACB TRIP ' + g.acb.tripped.id); g.acb.tripped = null; } }
  if (g.eng.shutdown) { if (g.eng.n > 0.02) UI.toast(`${g.name}: сброс аварийной остановки возможен только на остановленном двигателе`, 'warn'); else { done.push('SHUTDOWN'); g.eng.shutdown = null; } }
  if (g.eng.startFail) { done.push('START FAIL'); g.eng.startFail = false; g.eng.attempts = 0; }
  Log.add(`${g.name} RESET${done.length ? ': ' + done.join(', ') : ''}`, 'op');
};

/* ======================================================================
   11. UI ROOT, LAYOUT, MAIN LOOP
   ====================================================================== */
const UI = {
  panels: [], genPanels: [], blinkFast: true, blinkSlow: true, slowAcc: 0,
  toast(text, type = 'info', ms = 3500) {
    const t = U.el('div', 'toast ' + type, document.getElementById('toasts'), text);
    setTimeout(() => t.remove(), ms);
    const all = document.querySelectorAll('#toasts .toast'); if (all.length > 4) all[0].remove();
  },
  build() {
    const board = document.getElementById('board');
    for (const g of Model.gens) { const gp = new GenPanel(g, board); this.genPanels.push(gp); this.panels.push(gp); }
    this.sync = new SyncPanel(board); this.panels.push(this.sync);
    this.alarms = new AlarmPanel(board); this.panels.push(this.alarms);
    Layout.init();
    this.keys();
    // верхняя панель
    document.querySelectorAll('#tbSpeed button').forEach(b => b.addEventListener('click', () => {
      const s = +b.dataset.speed; if (s === 0) Sim.paused = !Sim.paused; else { Sim.scale = s; Sim.paused = false; }
      UI.syncSpeedButtons();
    }));
    document.getElementById('tbSound').addEventListener('click', ev => { ev.currentTarget.textContent = Audio.toggle() ? '🔊' : '🔇'; });
    document.addEventListener('pointerdown', () => Audio.init(), { once: true });
    document.getElementById('tbAlarm').addEventListener('click', () => this.alarms.el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' }));
  },
  keys() {   // клавиатура: ←/→ регулятор, ↓/↑ напряжение выбранного на SYNC SELECT генератора
    const map = { ArrowLeft: ['govOp', -1], ArrowRight: ['govOp', 1], ArrowDown: ['avrOp', -1], ArrowUp: ['avrOp', 1] };
    document.addEventListener('keydown', ev => { const m = map[ev.key], g = Sync.selected; if (!m || !g || ev.repeat) return; ev.preventDefault(); g[m[0]] = m[1]; });
    document.addEventListener('keyup', ev => { const m = map[ev.key], g = Sync.selected; if (!m || !g) return; g[m[0]] = 0; });
  },
  syncSpeedButtons() {
    document.querySelectorAll('#tbSpeed button').forEach(b => {
      const s = +b.dataset.speed; b.classList.toggle('act', s === 0 ? Sim.paused : (!Sim.paused && Sim.scale === s));
    });
  },
  update(dt) {
    for (const p of this.panels) p.update(dt);
    this.slowAcc += dt;
    if (this.slowAcc >= 0.1) {
      this.slowAcc = 0;
      const ms = performance.now();
      this.blinkFast = (ms % 500) < 280; this.blinkSlow = (ms % 1600) < 900;
      for (const p of this.panels) p.updateSlow();
      document.getElementById('tbClock').textContent = Sim.clockStr();
      const b = Model.bus;
      const ac = Alarms.counts(), ta = document.getElementById('tbAlarm');
      ta.textContent = ac.active ? `ALARM ${ac.active}` : 'ALARM';
      ta.classList.toggle('on', ac.unack > 0 && this.blinkFast); ta.classList.toggle('steady', ac.unack === 0 && ac.active > 0);
      document.getElementById('tbStatus').textContent = b.live ? `BUS ${(b.U * 440).toFixed(0)} V  ${b.f.toFixed(2)} Hz  ${b.P.toFixed(0)} kW` : 'BUS DEAD';
    }
  },
};

const Layout = {
  PW: 620, PH: 360, GAP: 12, PAD: 12, zoom: 1, userZoom: null, forceFit: false,
  init() {
    window.addEventListener('resize', () => this.apply());
    window.addEventListener('orientationchange', () => setTimeout(() => this.apply(), 250));
    document.getElementById('tbZoomIn').addEventListener('click', () => { this.userZoom = Math.min(2.2, (this.userZoom || this.zoom) * 1.15); this.apply(); });
    document.getElementById('tbZoomOut').addEventListener('click', () => { this.userZoom = Math.max(0.3, (this.userZoom || this.zoom) / 1.15); this.apply(); });
    document.getElementById('tbFit').addEventListener('click', () => { this.userZoom = null; this.forceFit = !this.forceFit; this.apply(); });
    this.apply();
  },
  units() { return UI.panels.map(p => p.el.classList.contains('span2') ? 2 : 1); },
  rowsFor(c) { // число строк при c колонках (с учётом панелей двойной ширины)
    let rows = 1, used = 0;
    for (const u of this.units()) { const uu = Math.min(u, c); if (used + uu > c) { rows++; used = 0; } used += uu; }
    return rows;
  },
  apply() {
    const vp = document.getElementById('viewport'), board = document.getElementById('board');
    const W = vp.clientWidth, H = vp.clientHeight, P = this.PW + this.GAP, Q = this.PH + this.GAP;
    const total = this.units().reduce((a, b) => a + b, 0);
    let best = { z: 0, c: 1 };
    for (let c = 1; c <= total; c++) {
      const r = this.rowsFor(c), w = c * P + this.PAD * 2, h = r * Q + this.PAD * 2;
      const z = Math.min(W / w, H / h);
      if (z > best.z + 1e-6) best = { z, c };
    }
    let c = best.c, z = best.z, snap = false;
    if (!this.forceFit && z < 0.75) {
      let r = Math.max(1, Math.floor(H / ((this.PH + this.GAP) * 0.88)));
      r = Math.min(r, 3);
      c = Math.max(2, Math.ceil(total / r));
      while (this.rowsFor(c) > r) c++;
      z = Math.min(1.25, (H - 2) / (this.rowsFor(c) * Q + this.PAD * 2));
      snap = true;
    }
    if (this.userZoom) { z = this.userZoom; snap = false; }
    this.zoom = z;
    board.style.gridTemplateColumns = `repeat(${c}, ${this.PW}px)`;
    board.style.zoom = z;
    vp.classList.toggle('snap', snap && W < 1100);
    this.cols = c;
  },
};

/* ---------- сценарий по умолчанию (этап 1) ---------- */
function buildModel() {
  Model.gens = []; for (let i = 0; i < CONFIG.gen.count; i++) { const g = new GenSet(i); g.autoSync = new AutoSync(g); Model.gens.push(g); }
  defineAlarms();
  Model.consumers = (CONFIG.consumers || [
    { id: 'BASE', name: 'TEST LOAD', kW: 600, pf: 0.82, on: true },
  ]).map(c => new Consumer(c));
}

let lastFrame = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - (lastFrame || ts)) / 1000); lastFrame = ts;
  Sim.frame(dt);
  UI.update(dt);
  requestAnimationFrame(loop);
}
buildModel();
UI.build();
requestAnimationFrame(loop);
window.SIM = { CONFIG, Model, Sim, UI, U, Log, Layout, Sync, Alarms, Protection, Automation };
